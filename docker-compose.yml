# Sobe a API + frontend com um comando:
#   cp .env.example .env   (e preencha OPENAI_API_KEY)
#   docker compose up --build
# Frontend: http://localhost:5173   API: http://localhost:5234
services:
  api:
    build:
      context: .
      dockerfile: src/ContentGen.Api/Dockerfile
    image: contentgen-api
    ports:
      - "5234:8080"
    environment:
      # Empty by default so the API still starts (the key is only needed when generating content)
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
    volumes:
      - contentgen-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: src/ContentGen.Web
      args:
        # Baked into the bundle; must match the host port the API is published on above
        VITE_API_BASE_URL: http://localhost:5234
    image: contentgen-web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  contentgen-data:
