# Sobe a API + frontend com um comando:
#   cp .env.example .env   (e preencha OPENAI_API_KEY)
#   docker compose up --build
# Frontend: http://localhost:5173   API: http://localhost:5234
services:
  api:
    build:
      context: .
      dockerfile: src/ContentGen.Api/Dockerfile
    image: contentgen-api
    ports:
      - "5234:8080"
    environment:
      # Empty by default so the API still starts (the key is only needed when generating content)
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      # Default to Groq (Llama 3.3 70B) for the demo. appsettings.json defaults to OpenAI,
      # but appsettings.Development.json (with the Groq config) is not used in the container,
      # so the provider must be set here. Override any of these in .env to use another provider.
      OpenAI__BaseUrl: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      OpenAI__Model: ${OPENAI_MODEL:-llama-3.3-70b-versatile}
      OpenAI__MaxTokens: ${OPENAI_MAX_TOKENS:-8192}
    volumes:
      - contentgen-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: src/ContentGen.Web
      args:
        # Baked into the bundle; must match the host port the API is published on above
        VITE_API_BASE_URL: http://localhost:5234
    image: contentgen-web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  contentgen-data:
